version: 2

models:
  - name: customers
    description: Customer dimension with geographic attributes
    columns:
      - name: customer_key
        description: Primary key
        tests:
          - not_null
          - unique
      - name: customer_name
        tests:
          - not_null
      - name: market_segment
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUTOMOBILE', 'BUILDING', 'FURNITURE', 'HOUSEHOLD', 'MACHINERY']

  - name: orders_summary
    description: Order header with aggregated line item metrics
    columns:
      - name: order_key
        description: Primary key
        tests:
          - not_null
          - unique
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_key
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['F', 'O', 'P']
      - name: order_date
        tests:
          - not_null
      - name: line_item_count
        tests:
          - not_null
      - name: total_quantity
        tests:
          - not_null
